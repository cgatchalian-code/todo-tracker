<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--cream:#f5f0e8;--cream2:#ede7d9;--cream3:#e4dccb;
--ink:#1c1917;--ink2:#44403c;--ink3:#78716c;--ink4:#a8a29e;
--accent:#c2410c;--green:#15803d;--green-l:#f0fdf4;
--blue:#1d4ed8;--blue-l:#eff6ff;--amber:#b45309;--amber-l:#fffbeb;
--border:rgba(28,25,23,0.1);--border2:rgba(28,25,23,0.18);
--r:6px;--rl:12px;
--sh:0 1px 3px rgba(28,25,23,0.07),0 4px 16px rgba(28,25,23,0.05);
--shl:0 4px 24px rgba(28,25,23,0.12),0 1px 4px rgba(28,25,23,0.08);
}
body{font-family:"DM Sans",sans-serif;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.55  0 0 0 0 0.4  0 0 0 0 0.25  0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(180deg,#faf2e8 0%,#f5e6d8 100%);background-attachment:fixed;color:var(--ink);min-height:100vh}
.header{background:#52261c;padding:2.5rem 3rem 0;position:relative;overflow:hidden}
.hi{max-width:1100px;margin:0 auto;position:relative;z-index:1}
h1{font-family:"DM Serif Display",serif;font-size:clamp(30px,5vw,50px);font-weight:400;line-height:1.1;letter-spacing:-0.02em;color:#fff5ec}
h1 em{font-style:italic;color:#f5d4a8}
.hm{font-size:11px;color:rgba(245,240,232,0.4);margin-top:6px;letter-spacing:0.06em;text-transform:uppercase}
.sr{display:flex;margin-top:1.75rem;flex-wrap:wrap}
.si{padding-right:2rem}
.si+.si{padding-left:2rem;border-left:1px solid rgba(255,255,255,0.1)}
.sn{font-family:"DM Serif Display",serif;font-size:26px;color:#f5f0e8;line-height:1}
.sn.red{color:#fb923c}
.sl{font-size:10px;color:rgba(245,240,232,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-top:3px}
.tabs{display:flex;gap:0;margin-top:1.5rem}
.tab{padding:10px 22px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;color:rgba(245,240,232,0.5);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all 0.15s}
.tab:hover{color:rgba(245,240,232,0.8)}
.tab.active{color:#f5f0e8;border-bottom:2px solid #f5f0e8}
.main{max-width:1100px;margin:0 auto;padding:2rem 3rem 4rem}
.ab{background:#fff;border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:1.5rem;box-shadow:var(--sh)}
.ab input[type=text]{flex:1;min-width:200px;border:none;outline:none;font-family:"DM Sans",sans-serif;font-size:14px;color:var(--ink);background:transparent}
.ab input[type=text]::placeholder{color:var(--ink4)}
.ab select,.ab input[type=date]{border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink2);background:var(--cream);outline:none;cursor:pointer;height:34px}
.dv{width:1px;height:28px;background:var(--border);flex-shrink:0}
.ba{background:#155e75;color:#f5f0e8;border:none;border-radius:var(--r);padding:8px 18px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;cursor:pointer;height:34px;transition:background 0.15s;white-space:nowrap}
.ba:hover{background:#0c4a5e}
.tc{background:#fff;border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.c-name{width:22%}col.c-notes{width:26%}col.c-status{width:16%}col.c-priority{width:12%}col.c-due{width:14%}col.c-act{width:10%}
thead tr{background:var(--cream2);border-bottom:1px solid var(--border)}
thead th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);text-align:left;padding:11px 12px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
thead th:hover{color:var(--ink)}
thead th.sa{color:var(--accent)}
.pr td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px;color:var(--ink);background:#fff;transition:background 0.1s;overflow:hidden}
.pr:hover td{background:#fafaf9}
.xr td{padding:6px 12px;background:#fafaf9;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink3);vertical-align:middle;overflow:hidden}
.xar td{padding:5px 12px;background:#fafaf9;border-bottom:1px solid var(--border)}
.anr td{padding:10px 12px;background:#fff;color:var(--ink4);font-size:13px;cursor:pointer;transition:color 0.1s,background 0.1s}
.anr:hover td{color:var(--ink2);background:#fafaf9}
.ar-row td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px;color:var(--ink3);background:#fff;overflow:hidden}
.ar-row:hover td{background:#fafaf9}
.nc{display:flex;align-items:flex-start;gap:7px}
.tg{width:16px;height:16px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--ink4);font-size:9px;border-radius:3px;transition:all 0.15s;flex-shrink:0;margin-top:2px}
.tg:hover{background:var(--cream3);color:var(--ink)}
.tg.open{transform:rotate(90deg);color:var(--ink2)}
.pn{font-weight:500;cursor:pointer;word-break:break-word;line-height:1.4}
.pn:hover{color:var(--accent)}
.pw{margin-top:4px;display:flex;align-items:center;gap:6px}
.pb{height:3px;background:var(--cream3);border-radius:2px;flex:1;overflow:hidden;max-width:80px}
.pf{height:100%;background:var(--green);border-radius:2px;transition:width 0.3s}
.pbl{font-size:10px;color:var(--ink4);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.bd{width:5px;height:5px;border-radius:50%}
.sd{background:var(--green-l);color:var(--green)}.sd .bd{background:var(--green)}
.sp{background:var(--blue-l);color:var(--blue)}.sp .bd{background:var(--blue)}
.sn2{background:var(--cream2);color:var(--ink3)}.sn2 .bd{background:var(--ink4)}
.ph{background:#fff1f2;color:#be123c;font-weight:500}
.pm{background:var(--amber-l);color:var(--amber)}
.plw{background:var(--green-l);color:var(--green)}
.ss{border:1px solid transparent;border-radius:20px;padding:2px 6px;font-family:"DM Sans",sans-serif;font-size:11px;background:var(--cream2);color:var(--ink2);cursor:pointer;outline:none;max-width:100%}
.ss:hover{border-color:var(--border2)}
.ss:focus{border-color:var(--accent);background:#fff}
.ds{border:1px solid transparent;border-radius:var(--r);padding:2px 5px;font-family:"DM Sans",sans-serif;font-size:11px;background:transparent;color:var(--ink3);cursor:pointer;outline:none;max-width:100%}
.ds:hover{border-color:var(--border2);background:var(--cream2)}
.notes-cell{font-size:12px;color:var(--ink3);line-height:1.5;word-break:break-word;overflow-wrap:break-word}
.notes-cell a{color:var(--blue);text-decoration:underline}
.notes-cell ul{padding-left:14px;margin:2px 0}
.ntb{background:none;border:0.5px solid var(--border2);border-radius:4px;padding:2px 7px;font-size:10px;font-family:"DM Sans",sans-serif;color:var(--ink3);cursor:pointer}
.ntb:hover{background:var(--cream2);color:var(--ink)}
.link-wrap{display:none;gap:4px;align-items:center}
.link-wrap.show{display:flex}
.linput{border:0.5px solid var(--border2);border-radius:4px;padding:3px 7px;font-size:11px;font-family:"DM Sans",sans-serif;color:var(--ink);background:#fff;outline:none;flex:1;min-width:80px}
.linput:focus{border-color:var(--accent)}
.lbtn{background:#155e75;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer}
.lbtn:hover{background:#0c4a5e}
.slr{display:flex;align-items:center;gap:6px}
.sc{width:13px;height:13px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.sdone{text-decoration:line-through;color:var(--ink4)}
.sub-due{border:1px solid transparent;border-radius:var(--r);padding:1px 5px;font-family:"DM Sans",sans-serif;font-size:10px;background:transparent;color:var(--ink4);cursor:pointer;outline:none;width:100%}
.sub-due:hover{border-color:var(--border2);background:var(--cream2)}
.sub-due.overdue{color:var(--accent);font-weight:500}
.sub-ts{font-size:10px;color:var(--green);background:var(--green-l);padding:1px 5px;border-radius:10px;white-space:nowrap}
.sub-dc{font-size:10px;padding:1px 5px;border-radius:10px;white-space:nowrap}
.sub-dc.ov{background:#fff1f2;color:#be123c}
.sub-dc.up{background:var(--amber-l);color:var(--amber)}
.act{background:none;border:none;cursor:pointer;padding:4px 5px;border-radius:4px;color:var(--ink4);font-size:18px;line-height:1}
.act:hover{background:var(--cream3);color:var(--ink)}
.act.restore{color:var(--green);opacity:0.7}
.act.restore:hover{opacity:1;background:var(--green-l)}
.acts{display:flex;gap:2px;align-items:center}
.asb{background:none;border:none;cursor:pointer;font-family:"DM Sans",sans-serif;font-size:11px;color:var(--ink4);padding:2px 0}
.asb:hover{color:var(--ink2)}
.er td{text-align:center;padding:3rem;color:var(--ink4);font-size:14px}
.arch-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.arch-ti{font-family:"DM Serif Display",serif;font-size:22px;font-weight:400}
.arch-ct{font-size:13px;color:var(--ink4)}
.arch-empty{text-align:center;padding:4rem 2rem;color:var(--ink4)}
.mbg{display:none;position:fixed;inset:0;background:rgba(28,25,23,0.5);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.mbg.open{display:flex}
.modal{background:#fff;border-radius:var(--rl);padding:1.75rem;width:100%;max-width:520px;margin:1rem;box-shadow:var(--shl);animation:mIn 0.18s ease;max-height:calc(100vh - 2rem);display:flex;flex-direction:column}
.modal-body{flex:1;min-height:0;overflow-y:auto;margin:0 -1.75rem;padding:0 1.75rem}
.modal>.mhd{flex-shrink:0}
.modal>.mft{flex-shrink:0;background:#fff}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(0.98)}to{opacity:1;transform:none}}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.mti{font-family:"DM Serif Display",serif;font-size:20px;font-weight:400}
.mcl{background:none;border:none;cursor:pointer;font-size:18px;color:var(--ink4);padding:2px 6px;border-radius:4px}
.mcl:hover{background:var(--cream2);color:var(--ink)}
.modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink3);margin-bottom:5px;margin-top:14px}
.modal input[type=text],.modal input[type=date],.modal select{width:100%;border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink);background:var(--cream);outline:none;transition:border-color 0.1s}
.modal input:focus,.modal select:focus{border-color:var(--accent);background:#fff}
.mnote{font-size:11px;color:var(--ink4);margin-top:4px}
#mo ul,#mo ol{padding-left:22px;margin:2px 0}
#mo li{margin:1px 0}
.mft{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)}
.bcn{background:none;border:1px solid var(--border2);border-radius:var(--r);padding:8px 16px;font-family:"DM Sans",sans-serif;font-size:13px;color:var(--ink2);cursor:pointer}
.bcn:hover{background:var(--cream2)}
.bsv{background:#155e75;border:none;border-radius:var(--r);padding:8px 18px;font-family:"DM Sans",sans-serif;font-size:13px;font-weight:500;color:#f5f0e8;cursor:pointer;transition:background 0.15s}
.bsv:hover{background:#0c4a5e}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pr{animation:fu 0.18s ease both}
</style>
</head>
<body>
<header class="header">
<div class="hi">
<div style="display:flex;align-items:center;gap:16px">
<svg width="54" height="54" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink:0">
<defs><clipPath id="bw-clip"><circle cx="32" cy="32" r="30"/></clipPath></defs>
<circle cx="32" cy="32" r="30" fill="#f5d4a8"/>
<circle cx="32" cy="22" r="6" fill="#fff5ec"/>
<g clip-path="url(#bw-clip)" stroke="#155e75" fill="none" stroke-linecap="round" stroke-width="2.2">
<path d="M2 38 Q17 30 32 38 T62 38"/>
<path d="M2 47 Q17 41 32 47 T62 47" opacity="0.55"/>
</g>
</svg>
<h1>To-Do <em>List</em></h1>
</div>
<p class="hm">Saves automatically &middot; Chelsea Gatchalian</p>
<div class="sr" id="sr"></div>
<div class="tabs">
<button class="tab active" id="tab-active" onclick="switchTab('active')">Active</button>
<button class="tab" id="tab-archive" onclick="switchTab('archive')">Archive</button>
</div>
</div>
</header>
<main class="main">
<div id="active-view">
<div class="ab">
<input type="text" id="nn" placeholder="Add a new project...">
<div class="dv"></div>
<select id="ns"><option value="not">Not started</option><option value="prog">In progress</option><option value="done">Done</option></select>
<select id="np"><option value="">No priority</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select>
<input type="date" id="nd">
<button class="ba" id="addBtn">+ Add project</button>
<button class="ba" onclick="exportData()" style="background:var(--ink3)" title="Download backup">&#8659; Backup</button>
<label style="background:var(--ink3);color:#f5f0e8;border:none;border-radius:var(--r);padding:0 12px;font-size:13px;font-weight:500;cursor:pointer;height:34px;display:flex;align-items:center;white-space:nowrap" title="Restore from backup">&#8657; Restore<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
</div>
<div class="tc">
<table>
<colgroup><col class="c-name"><col class="c-notes"><col class="c-status"><col class="c-priority"><col class="c-due"><col class="c-act"></colgroup>
<thead><tr>
<th onclick="sortBy('name')" id="th-name">Name <span id="si-name"></span></th>
<th>Notes</th>
<th onclick="sortBy('status')" id="th-status">Status <span id="si-status"></span></th>
<th onclick="sortBy('priority')" id="th-priority">Priority <span id="si-priority"></span></th>
<th onclick="sortBy('due')" id="th-due">Due <span id="si-due"></span></th>
<th></th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
<div id="archive-view" style="display:none">
<div class="arch-hd"><div class="arch-ti">Archived projects</div><div class="arch-ct" id="arc-count"></div></div>
<div id="arc-empty" class="arch-empty" style="display:none"><p>No archived projects yet. Mark a project as Done and it will appear here.</p></div>
<div class="tc" id="arc-wrap">
<table><colgroup><col class="c-name"><col class="c-notes"><col class="c-priority"><col class="c-due"><col class="c-act"></colgroup>
<thead><tr><th>Project</th><th>Notes</th><th>Priority</th><th>Completed</th><th></th></tr></thead>
<tbody id="arc-tbody"></tbody></table>
</div>
</div>
</main>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeModal()">
<div class="modal">
<div class="mhd"><div class="mti" id="mtitle">Edit project</div><button class="mcl" onclick="closeModal()">&#10005;</button></div>
<div class="modal-body">
<label>Project name</label><input type="text" id="mn" placeholder="Enter project name...">
<label>Notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink4);font-size:10px">(supports bullets &amp; links)</span></label>
<div style="border:1px solid var(--border2);border-radius:var(--r);overflow:hidden">
<div style="display:flex;gap:4px;padding:5px 8px;background:var(--cream2);border-bottom:1px solid var(--border);flex-wrap:wrap">
<button class="ntb" onclick="fmtN('insertUnorderedList')">&#8226; List</button>
<button class="ntb" onclick="fmtN('bold')"><b>B</b></button>
<button class="ntb" onclick="fmtN('italic')"><i>I</i></button>
<button class="ntb" onclick="toggleLink()">&#128279; Link</button>
</div>
<div class="link-wrap" id="link-wrap" style="padding:5px 8px;background:#fff;border-bottom:1px solid var(--border)">
<input class="linput" id="lurl" placeholder="https://..." type="url">
<input class="linput" id="ltxt" placeholder="Link text" type="text" style="max-width:120px">
<button class="lbtn" onclick="insertLink()">Insert</button>
<button class="ntb" onclick="toggleLink()">Cancel</button>
</div>
<div id="mo" contenteditable="true" style="padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);outline:none;min-height:80px;background:#fff;line-height:1.6"></div>
</div>
<p class="mnote">Tip: type <code>- </code> at start of a line + Space to auto-create a bullet.</p>
<label>Subtasks</label>
<div id="msub-list"></div>
<div style="display:flex;gap:6px;margin-top:6px">
<input type="text" id="msub-input" placeholder="Add a subtask..." style="flex:1;border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--cream);outline:none">
<button class="bcn" onclick="addSubModal()" style="padding:8px 14px">+ Add</button>
</div>
<label>Status</label><select id="ms"><option value="not">Not started</option><option value="prog">In progress</option><option value="done">Done</option></select>
<label>Priority</label><select id="mp"><option value="">No priority</option><option value="high">High</option><option value="med">Medium</option><option value="low">Low</option></select>
<label>Due date</label><input type="date" id="md">
</div>
<div class="mft"><button class="bcn" onclick="closeModal()">Cancel</button><button class="bsv" onclick="saveModal()">Save changes</button></div>
</div>
</div>
<script>
var STORE="todo_v7";
var sortCol=null,sortDir=1,editId=null,nId=500,nSub=9000,curTab="active",savedSel=null,addingSubFor=null,focusInlineSub=false;
var defs=[
{id:1,name:"Arena Super User - Items World",status:"done",priority:"",due:"",notesHtml:"<div>Resources:</div>",subtasks:[{id:101,text:"Review Items World overview doc",done:true,due:"",completedAt:"2026-04-01 09:00"},{id:102,text:"Complete super user certification",done:true,due:"",completedAt:"2026-04-01 10:30"}],open:false,archivedAt:"2026-04-01"},
{id:2,name:"Pop 7 Visual Guide",status:"not",priority:"med",due:"",notesHtml:"",subtasks:[],open:false,archivedAt:null},
{id:3,name:"Comp Proj",status:"not",priority:"",due:"",notesHtml:"<div>Send out meeting invites</div>",subtasks:[{id:301,text:"Send out meeting invites",done:false,due:"",completedAt:null},{id:302,text:"Prepare agenda",done:false,due:"",completedAt:null}],open:false,archivedAt:null},
{id:4,name:"Support Capacity Planning",status:"not",priority:"",due:"",notesHtml:"<div>Assist with FX</div>",subtasks:[{id:401,text:"Do sgV2 HT seq",done:false,due:"",completedAt:null},{id:402,text:"Do sgPLUS HT seq",done:false,due:"",completedAt:null},{id:403,text:"Assist with FX",done:false,due:"",completedAt:null}],open:false,archivedAt:null}
];
function load(){
try{
var d=localStorage.getItem(STORE)||localStorage.getItem("todo_v6")||localStorage.getItem("todo_v5")||localStorage.getItem("todo_v4")||localStorage.getItem("todo_v3");
var p=d?JSON.parse(d):JSON.parse(JSON.stringify(defs));
p.forEach(function(proj){
if(!proj.notesHtml){var h="";if(proj.notes)h+="<div>"+proj.notes.replace(/\n/g,"</div><div>")+"</div>";if(proj.links&&proj.links.length)proj.links.forEach(function(l){h+='<div><a href="'+l.url+'">'+l.label+"</a></div>";});proj.notesHtml=h;}
if(!proj.notesHtml)proj.notesHtml="";
proj.subtasks.forEach(function(s){if(!("due"in s))s.due="";if(!("completedAt"in s))s.completedAt=null;});
if(!("archivedAt"in proj))proj.archivedAt=null;
});
return p;
}catch(e){return JSON.parse(JSON.stringify(defs));}
}
function save(){try{localStorage.setItem(STORE,JSON.stringify(projects));}catch(e){}}
var projects=load();
nId=Math.max.apply(null,projects.map(function(p){return p.id;}).concat([nId]))+1;
var asi=[];projects.forEach(function(p){p.subtasks.forEach(function(s){asi.push(s.id);});});
nSub=Math.max.apply(null,asi.concat([nSub]))+1;
function fmtN(cmd){document.getElementById("mo").focus();document.execCommand(cmd,false,null);}
function toggleLink(){
var w=document.getElementById("link-wrap");
if(!w.classList.contains("show")){
var sel=window.getSelection();
if(sel&&sel.rangeCount>0)savedSel=sel.getRangeAt(0).cloneRange();
if(sel&&sel.toString())document.getElementById("ltxt").value=sel.toString();
w.classList.add("show");document.getElementById("lurl").focus();
}else{
w.classList.remove("show");document.getElementById("lurl").value="";document.getElementById("ltxt").value="";
}
}
function insertLink(){
var url=document.getElementById("lurl").value.trim();
var txt=document.getElementById("ltxt").value.trim();
if(!url)return;
document.getElementById("mo").focus();
if(savedSel){var sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedSel);}
document.execCommand("insertHTML",false,'<a href="'+url+'" target="_blank" rel="noopener">'+( txt||url)+"</a>");
toggleLink();savedSel=null;
}
document.getElementById("mo").addEventListener("paste",function(e){
var sel=window.getSelection();
if(!sel||!sel.rangeCount)return;
var selText=sel.toString();
if(!selText.trim())return;
var raw=(e.clipboardData&&e.clipboardData.getData("text/plain"))||"";
var url=raw.trim();
if(!/^https?:\/\/\S+$/i.test(url))return;
e.preventDefault();
var safeText=selText.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
var safeUrl=url.replace(/"/g,"&quot;");
document.execCommand("insertHTML",false,'<a href="'+safeUrl+'" target="_blank" rel="noopener">'+safeText+'</a>');
});
document.addEventListener("keyup",function(e){
var mo=document.getElementById("mo");
if(!mo||!mo.contains(e.target))return;
if(e.key===" "){
var sel=window.getSelection();
if(!sel||!sel.rangeCount)return;
var range=sel.getRangeAt(0);
var node=range.startContainer;
if(node.nodeType===3){
var text=node.textContent;
var offset=range.startOffset;
var ls=text.lastIndexOf("\n",offset-1)+1;
var lt=text.slice(ls,offset);
if(lt==="-"||lt==="\u2022"){node.textContent=text.slice(0,ls)+text.slice(offset);document.execCommand("insertUnorderedList",false,null);}
}
}
});
function fd(d){if(!d)return"--";var p=d.split("-");return p[1]+"/"+p[2]+"/"+p[0].slice(2);}
function dDis(d){if(!d)return'<span style="color:var(--ink4);font-size:11px">--</span>';var t=new Date().toISOString().split("T")[0];var p=d.split("-");var f=p[1]+"/"+p[2]+"/"+p[0].slice(2);return d<t?'<span style="color:var(--accent);font-size:11px;font-weight:500">! '+f+"</span>":'<span style="color:var(--ink3);font-size:11px">'+f+"</span>";}
function fmtTs(ts){if(!ts)return"";try{var d=new Date(ts);if(isNaN(d))return ts;return(d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2)+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}catch(e){return ts;}}
function sDC(s){if(!s.due)return"";var t=new Date().toISOString().split("T")[0];var cls=s.due<t&&!s.done?"sub-dc ov":"sub-dc up";return'<span class="'+cls+'">'+fd(s.due)+"</span>";}
function sProg(p){if(!p.subtasks.length)return"";var done=p.subtasks.filter(function(s){return s.done;}).length;var pct=Math.round(done/p.subtasks.length*100);return'<div class="pw"><div class="pb"><div class="pf" style="width:'+pct+'%"></div></div><span class="pbl">'+done+"/"+p.subtasks.length+"</span></div>";}
function pBadge(p){if(p==="high")return'<span class="badge ph">High</span>';if(p==="med")return'<span class="badge pm">Med</span>';if(p==="low")return'<span class="badge plw">Low</span>';return'<span style="color:var(--ink4);font-size:11px">--</span>';}
function nDisp(html){if(!html)return"";return html.replace(/<a /g,'<a target="_blank" rel="noopener" ');}
function rStats(){
var act=projects.filter(function(p){return p.status!=="done";});
var done=projects.filter(function(p){return p.status==="done";});
var prog=projects.filter(function(p){return p.status==="prog";});
var allS=[];projects.forEach(function(p){allS=allS.concat(p.subtasks);});
var sD=allS.filter(function(s){return s.done;}).length;
var tod=new Date().toISOString().split("T")[0];
var ov=act.filter(function(p){return p.due&&p.due<tod;}).length;
var items=[{n:act.length,l:"Active"},{n:prog.length,l:"In progress"},{n:done.length,l:"Done"},{n:sD+"/"+allS.length,l:"Subtasks"}];
if(ov)items.push({n:ov,l:"Overdue",r:true});
document.getElementById("sr").innerHTML=items.map(function(it){return'<div class="si"><div class="sn'+(it.r?" red":"")+'">'+it.n+"</div><div class=\"sl\">"+it.l+"</div></div>";}).join("");
}
function switchTab(t){
curTab=t;
document.getElementById("tab-active").classList.toggle("active",t==="active");
document.getElementById("tab-archive").classList.toggle("active",t==="archive");
document.getElementById("active-view").style.display=t==="active"?"":"none";
document.getElementById("archive-view").style.display=t==="archive"?"":"none";
if(t==="archive")renderArchive();
}
function renderArchive(){
var done=projects.filter(function(p){return p.status==="done";});
var tbody=document.getElementById("arc-tbody");tbody.innerHTML="";
document.getElementById("arc-count").textContent=done.length+" completed project"+(done.length!==1?"s":"");
if(!done.length){document.getElementById("arc-empty").style.display="";document.getElementById("arc-wrap").style.display="none";return;}
document.getElementById("arc-empty").style.display="none";document.getElementById("arc-wrap").style.display="";
done.forEach(function(p){
var sd=p.subtasks.filter(function(s){return s.done;}).length;
var st=p.subtasks.length;
var tr=document.createElement("tr");tr.className="ar-row";
tr.innerHTML='<td><div style="display:flex;align-items:flex-start;gap:7px"><span style="color:var(--green);flex-shrink:0;margin-top:1px">&#10003;</span><div><div class="pn" data-edit="'+p.id+'">'+p.name+"</div>"+(st?'<div style="font-size:10px;color:var(--ink4);margin-top:2px">'+sd+"/"+st+" subtasks</div>":"")+"</div></div></td>"
+'<td><div class="notes-cell">'+nDisp(p.notesHtml||"")+"</div></td>"
+'<td>'+pBadge(p.priority)+"</td>"
+'<td><span style="font-size:11px;color:var(--ink4)">'+( p.archivedAt?fd(p.archivedAt):"--")+"</span></td>"
+'<td><div class="acts"><button class="act restore" data-restore="'+p.id+'" title="Restore">&#8635;</button><button class="act" data-del="'+p.id+'" title="Delete">&#10005;</button></div></td>';
tbody.appendChild(tr);
});
}
function render(){
save();
var tbody=document.getElementById("tbody");tbody.innerHTML="";
var act=projects.filter(function(p){return p.status!=="done";});
var ord={prog:1,not:0},pord={high:3,med:2,low:1,"":0};
if(sortCol){act.sort(function(a,b){var av=a[sortCol]||"",bv=b[sortCol]||"";if(sortCol==="status"){av=ord[av]||0;bv=ord[bv]||0;}if(sortCol==="priority"){av=pord[av]||0;bv=pord[bv]||0;}if(av<bv)return -sortDir;if(av>bv)return sortDir;return 0;});}
["name","status","priority","due"].forEach(function(c){var el=document.getElementById("si-"+c);var th=document.getElementById("th-"+c);if(el)el.textContent=sortCol===c?(sortDir===1?"\u2191":"\u2193"):"";if(th)th.classList.toggle("sa",sortCol===c);});
if(!act.length){var e=document.createElement("tr");e.className="er";e.innerHTML='<td colspan="6">No active projects</td>';tbody.appendChild(e);}
act.forEach(function(p){
var tr=document.createElement("tr");tr.className="pr";
var sO='<option value="not"'+(p.status==="not"?" selected":"")+'>Not started</option><option value="prog"'+(p.status==="prog"?" selected":"")+'>In progress</option><option value="done"'+(p.status==="done"?" selected":"")+'>Done</option>';
var pO='<option value=""'+(p.priority===""?" selected":"")+'>--</option><option value="high"'+(p.priority==="high"?" selected":"")+'>High</option><option value="med"'+(p.priority==="med"?" selected":"")+'>Med</option><option value="low"'+(p.priority==="low"?" selected":"")+'>Low</option>';
tr.innerHTML='<td><div class="nc"><button class="tg'+(p.open?" open":"")+'" data-id="'+p.id+'">&#9658;</button><div style="flex:1;min-width:0"><div class="pn" data-edit="'+p.id+'">'+p.name+"</div>"+sProg(p)+"</div></div></td>"
+'<td><div class="notes-cell">'+nDisp(p.notesHtml||"")+"</div></td>"
+'<td><select class="ss" data-field="status" data-id="'+p.id+'">'+sO+"</select></td>"
+'<td><select class="ss" data-field="priority" data-id="'+p.id+'">'+pO+"</select></td>"
+'<td><input type="date" class="ds" value="'+(p.due||"")+'" data-id="'+p.id+'"><div style="margin-top:2px">'+dDis(p.due)+"</div></td>"
+'<td><div class="acts"><button class="act" data-edit="'+p.id+'" title="Edit">&#9998;</button><button class="act" data-del="'+p.id+'" title="Delete">&#10005;</button></div></td>';
tbody.appendChild(tr);
if(p.open){
p.subtasks.forEach(function(st){
var sr=document.createElement("tr");sr.className="xr";
var ts=st.completedAt?'<span class="sub-ts">&#10003; '+fmtTs(st.completedAt)+"</span>":"";
var dc=sDC(st);
var so=st.due&&st.due<new Date().toISOString().split("T")[0]&&!st.done;
sr.innerHTML='<td colspan="2" style="padding-left:36px"><div class="slr"><input type="checkbox" class="sc" '+(st.done?"checked":"")+' data-pid="'+p.id+'" data-sid="'+st.id+'"><span class="'+(st.done?"sdone":"")+'" contenteditable="true" data-esub="'+p.id+"-"+st.id+'" style="outline:none;flex:1;min-width:0;word-break:break-word">'+st.text+"</span>"+dc+ts+"</div></td>"
+'<td></td><td></td>'
+'<td><input type="date" class="sub-due'+(so?" overdue":"")+'" value="'+(st.due||"")+'" data-sdid="'+p.id+"-"+st.id+'" title="Subtask due date"></td>'
+'<td style="text-align:right"><button class="act" data-dsub="'+p.id+"-"+st.id+'">&#10005;</button></td>';
tbody.appendChild(sr);
});
var ar=document.createElement("tr");ar.className="xar";
if(addingSubFor===p.id){
ar.innerHTML='<td colspan="6" style="padding-left:36px"><div style="display:flex;gap:6px;align-items:center"><input type="text" id="inline-sub-input" placeholder="Subtask name..." style="flex:1;border:1px solid var(--border2);border-radius:var(--r);padding:5px 9px;font-size:13px;font-family:&apos;DM Sans&apos;,sans-serif;outline:none;background:#fff" data-inline-sub="'+p.id+'"><button class="ba" style="height:28px;padding:4px 14px;font-size:12px" data-inline-sub-add="'+p.id+'">Add</button><button class="asb" data-inline-sub-cancel="1" style="padding:0 6px;font-size:14px">&#10005;</button></div></td>';
}else{
ar.innerHTML='<td colspan="6" style="padding-left:36px"><button class="asb" data-addsub="'+p.id+'">+ Add subtask</button></td>';
}
tbody.appendChild(ar);
}
});
var f=document.createElement("tr");f.className="anr";
f.innerHTML='<td colspan="6" id="newrow">+ New project</td>';
tbody.appendChild(f);
rStats();
if(curTab==="archive")renderArchive();
if(focusInlineSub){var ii=document.getElementById("inline-sub-input");if(ii)ii.focus();focusInlineSub=false;}
}
document.addEventListener("click",function(e){
var t=e.target;
if(t.tagName==="A")return;
if(t.dataset.id&&t.classList.contains("tg")){var p=projects.find(function(x){return x.id==t.dataset.id;});if(p){p.open=!p.open;render();}}
else if(t.dataset.edit){openModal(parseInt(t.dataset.edit));}
else if(t.dataset.restore){var p=projects.find(function(x){return x.id==t.dataset.restore;});if(p){p.status="not";p.archivedAt=null;render();renderArchive();}}
else if(t.dataset.del){if(confirm("Delete this project permanently?")){projects=projects.filter(function(p){return p.id!=t.dataset.del;});render();if(curTab==="archive")renderArchive();}}
else if(t.dataset.addsub){addingSubFor=parseInt(t.dataset.addsub);focusInlineSub=true;render();}
else if(t.dataset.inlineSubAdd){inlineSubAdd(parseInt(t.dataset.inlineSubAdd));}
else if(t.dataset.inlineSubCancel){addingSubFor=null;render();}
else if(t.dataset.dsub){var ids=t.dataset.dsub.split("-");var ppp=projects.find(function(x){return x.id==ids[0];});if(ppp){ppp.subtasks=ppp.subtasks.filter(function(s){return s.id!=ids[1];});render();}}
else if(t.dataset.msubDel){var pm=projects.find(function(x){return x.id===editId;});if(pm){pm.subtasks=pm.subtasks.filter(function(s){return s.id!=t.dataset.msubDel;});save();renderSubModal();render();}}
else if(t.id==="newrow"||t.id==="addBtn"){if(t.id==="addBtn")addProject();else document.getElementById("nn").focus();}
});
document.addEventListener("change",function(e){
var t=e.target;
if(t.classList.contains("ss")&&t.dataset.id&&t.dataset.field){
var p=projects.find(function(x){return x.id==t.dataset.id;});
if(p){p[t.dataset.field]=t.value;if(t.dataset.field==="status"&&t.value==="done"){p.archivedAt=new Date().toISOString().split("T")[0];}if(t.dataset.field==="status"&&t.value!=="done"){p.archivedAt=null;}render();}
}else if(t.classList.contains("ds")&&t.dataset.id){
var pp=projects.find(function(x){return x.id==t.dataset.id;});if(pp){pp.due=t.value;render();}
}else if(t.classList.contains("sc")&&t.dataset.pid&&t.dataset.sid){
var ppp=projects.find(function(x){return x.id==t.dataset.pid;});
if(ppp){var s=ppp.subtasks.find(function(x){return x.id==t.dataset.sid;});if(s){s.done=t.checked;s.completedAt=t.checked?new Date().toLocaleString("en-US",{month:"numeric",day:"numeric",year:"2-digit",hour:"2-digit",minute:"2-digit"}):null;render();}}
}else if(t.classList.contains("sub-due")&&t.dataset.sdid){
var ids=t.dataset.sdid.split("-");var proj=projects.find(function(x){return x.id==ids[0];});
if(proj){var sub=proj.subtasks.find(function(x){return x.id==ids[1];});if(sub){sub.due=t.value;render();}}
}else if(t.dataset.msubToggle){
var pm=projects.find(function(x){return x.id===editId;});
if(pm){var sm=pm.subtasks.find(function(x){return x.id==t.dataset.msubToggle;});if(sm){sm.done=t.checked;sm.completedAt=t.checked?new Date().toLocaleString("en-US",{month:"numeric",day:"numeric",year:"2-digit",hour:"2-digit",minute:"2-digit"}):null;save();renderSubModal();render();}}
}
});
document.addEventListener("blur",function(e){
var t=e.target;
if(t.dataset.esub){var ids=t.dataset.esub.split("-");var p=projects.find(function(x){return x.id==ids[0];});if(p){var s=p.subtasks.find(function(x){return x.id==ids[1];});if(s&&t.textContent.trim()){s.text=t.textContent.trim();save();}}}
else if(t.dataset.msubEdit){var pm=projects.find(function(x){return x.id===editId;});if(pm){var sm=pm.subtasks.find(function(x){return x.id==t.dataset.msubEdit;});if(sm&&t.value.trim()){sm.text=t.value.trim();save();render();}}}
},true);
function addProject(){
var name=document.getElementById("nn").value.trim();if(!name)return;
var status=document.getElementById("ns").value;
var newId=nId++;
projects.push({id:newId,name:name,status:status,priority:document.getElementById("np").value,due:document.getElementById("nd").value,notesHtml:"",subtasks:[],open:true,archivedAt:status==="done"?new Date().toISOString().split("T")[0]:null});
document.getElementById("nn").value="";document.getElementById("nd").value="";render();
openModal(newId,"notes");
}
function sortBy(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}render();}
function openModal(id,focusField){
var p=projects.find(function(x){return x.id===id;});if(!p)return;
editId=id;
document.getElementById("mtitle").textContent=p.name;
document.getElementById("mn").value=p.name;
document.getElementById("mo").innerHTML=p.notesHtml||"";
document.getElementById("ms").value=p.status;
document.getElementById("mp").value=p.priority||"";
document.getElementById("md").value=p.due||"";
document.getElementById("msub-input").value="";
renderSubModal();
document.getElementById("link-wrap").classList.remove("show");
document.getElementById("lurl").value="";
document.getElementById("ltxt").value="";
document.getElementById("mbg").classList.add("open");
setTimeout(function(){document.getElementById(focusField==="notes"?"mo":"mn").focus();},50);
}
function renderSubModal(){
var p=projects.find(function(x){return x.id===editId;});if(!p)return;
var list=document.getElementById("msub-list");
if(!p.subtasks.length){list.innerHTML='<div style="font-size:12px;color:var(--ink4);padding:4px 0 2px">No subtasks yet.</div>';return;}
list.innerHTML=p.subtasks.map(function(s){
var safe=s.text.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
return '<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><input type="checkbox" class="sc" '+(s.done?"checked":"")+' data-msub-toggle="'+s.id+'"><input type="text" value="'+safe+'" data-msub-edit="'+s.id+'" style="flex:1;border:1px solid var(--border2);border-radius:var(--r);padding:5px 9px;font-family:\'DM Sans\',sans-serif;font-size:13px;color:'+(s.done?"var(--ink4)":"var(--ink)")+';background:#fff;outline:none'+(s.done?";text-decoration:line-through":"")+'"><button class="act" data-msub-del="'+s.id+'" title="Delete">&#10005;</button></div>';
}).join("");
}
function inlineSubAdd(pid){
var pp=projects.find(function(x){return x.id==pid;});
var i=document.getElementById("inline-sub-input");
if(pp&&i&&i.value.trim()){
pp.subtasks.push({id:nSub++,text:i.value.trim(),done:false,due:"",completedAt:null});
focusInlineSub=true;
render();
}
}
function addSubModal(){
if(editId==null)return;
var p=projects.find(function(x){return x.id===editId;});if(!p)return;
var inp=document.getElementById("msub-input");
var txt=inp.value.trim();if(!txt)return;
p.subtasks.push({id:nSub++,text:txt,done:false,due:"",completedAt:null});
inp.value="";
save();renderSubModal();render();
inp.focus();
}
function closeModal(){document.getElementById("mbg").classList.remove("open");editId=null;savedSel=null;}
function saveModal(){
var p=projects.find(function(x){return x.id===editId;});if(!p)return;
var os=p.status;
p.name=document.getElementById("mn").value.trim()||p.name;
p.notesHtml=document.getElementById("mo").innerHTML;
p.status=document.getElementById("ms").value;
p.priority=document.getElementById("mp").value;
p.due=document.getElementById("md").value;
if(p.status==="done"&&os!=="done"){p.archivedAt=new Date().toISOString().split("T")[0];}
if(p.status!=="done"){p.archivedAt=null;}
closeModal();render();
}
function exportData(){var d=JSON.stringify(projects,null,2);var b=new Blob([d],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="todo-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();}
function importData(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!Array.isArray(d))throw new Error("Invalid");projects=d;save();render();alert("Restored "+d.length+" projects!");}catch(err){alert("Invalid backup file");}};r.readAsText(f);}
document.addEventListener("keydown",function(e){
if(e.target&&e.target.id==="inline-sub-input"){
if(e.key==="Enter"){e.preventDefault();inlineSubAdd(parseInt(e.target.dataset.inlineSub));return;}
if(e.key==="Escape"){addingSubFor=null;render();return;}
}
if(e.key==="Escape")closeModal();
});
document.getElementById("nn").addEventListener("keydown",function(e){if(e.key==="Enter")addProject();});
document.getElementById("msub-input").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addSubModal();}});
render();
</script>
</body>
</html>
